name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create the Android app around index.html
        run: |
          mkdir -p app/www app/assets
          cp index.html app/www/index.html
          cp assets/icon-only.png assets/splash.png app/assets/
          cd app
          npm init -y >/dev/null
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2
          npx cap init "TAJ STORE" tj.tajstore.app --web-dir www
          npx cap add android
          npx @capacitor/assets@3.0.5 generate --android --iconBackgroundColor "#0c0a10" --splashBackgroundColor "#0c0a10" || echo "icon step skipped"
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TAJ-STORE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TAJ-STORE-apk
          path: TAJ-STORE.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: TAJ STORE APK (${{ github.run_number }})
          body: "APK-и TAJ STORE. Файли TAJ-STORE.apk-ро ба телефон боргирӣ карда насб кунед."
          files: TAJ-STORE.apk
