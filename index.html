<style>
:root{--b:#5b2ee0;--b2:#7a4dff;--p1:#4a22c8;--p2:#a477ff;--ink:#1c1636;--mut:#6f6890;--ln:#e9e4f6;--bg:#f6f3fd;--ok:#16a34a;--red:#e5334b;--gold:#ffb400;--pink:#e84a9b;--lil:#ece6fb;--sh:0 6px 20px rgba(60,30,140,.12);--card:#fff;--pic1:#f3effd;--pic2:#e7defb;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}img{max-width:100%}a{color:inherit;text-decoration:none}main:focus,main:focus-visible{outline:none}
:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:99;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 14px 8px}
.tr{display:flex;align-items:center;gap:8px;max-width:1180px;margin:0 auto;flex-wrap:wrap}.tr .brand{order:1}.tr .tact{order:3;display:flex;gap:8px;align-items:center}.tr nav.tabs{order:2}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--b);text-decoration:none;flex:1}
.lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;display:grid;place-items:center}
.ib{position:relative;width:38px;height:38px;border:0;border-radius:12px;background:var(--card);color:var(--b);display:inline-grid;place-items:center;box-shadow:var(--sh);text-decoration:none;flex:none}
.dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/17px system-ui;text-align:center;padding:0 4px;font-style:normal}
.tr select{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:0 4px;height:38px}
.search{min-width:0;max-width:100%;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:0 6px 0 12px;margin:0;height:44px;flex:0 0 100%;order:9;color:var(--mut)}
.search input{flex:1;border:0;outline:0;background:transparent;min-width:0;height:100%}
.cam{border:0;background:var(--lil);color:var(--b);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;text-decoration:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(60,30,140,.12);border-radius:20px 20px 0 0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11px;padding:4px 0;position:relative;min-width:0}
.tab.on{color:var(--b);font-weight:700}.tab.dk{display:none}.tab .dot{top:-2px;right:calc(50% - 20px)}
main{max-width:1180px;margin:0 auto;padding:6px 14px 16px;outline:0}
.hd{display:flex;align-items:center;gap:8px;margin:6px 0 14px}.hd h1{flex:1;font-size:18px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd .sp0{width:38px}
.crumb{font-size:12px;color:var(--mut);margin:2px 0 8px}.crumb a{text-decoration:none}
.banner{position:relative;border-radius:22px;overflow:hidden;height:150px;color:#fff;box-shadow:var(--sh)}
.slide{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;opacity:0;transition:opacity .5s;pointer-events:none}.slide.on{opacity:1;pointer-events:auto}
.slide b{font-size:13px;letter-spacing:.3px}.slide h2{font-size:24px;line-height:1.1;max-width:60%}.slide .art{position:absolute;right:6px;bottom:0;width:140px;height:140px}
.dots{display:flex;justify-content:center;gap:5px;margin:8px 0}.dots i{width:7px;height:7px;border-radius:4px;background:#cfc6ee}.dots i.on{width:18px;background:var(--b)}
.btn{background:var(--b);color:#fff;border:0;border-radius:13px;padding:11px 16px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.alt{background:var(--card);color:var(--b);border:1px solid var(--b)}.btn.red{background:var(--red)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}.btn.blk{width:100%}.btn.wh{background:#fff;color:var(--b)}.btn:disabled{opacity:.45;cursor:not-allowed}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}.cat{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:12px;text-align:center;border:0;background:none}
.cc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;overflow:hidden}.cc svg{width:46px;height:46px}
.sh{display:flex;align-items:center;margin:18px 0 8px;gap:8px}.sh h2{flex:1;font-size:17px}.sh a{color:var(--b);font-weight:600;text-decoration:none;font-size:13px}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}.hs>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:8px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.pic{aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,var(--pic1),var(--pic2));display:grid;place-items:center;overflow:hidden;position:relative}.pic svg{width:78%;height:78%}.pic img{width:100%;height:100%;object-fit:cover}
.hb{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:var(--card);color:var(--b);display:grid;place-items:center;box-shadow:var(--sh)}.hb.on{color:var(--red)}
.mt{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;font-weight:700;font-size:12px}
.pp{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.pp b{font-size:16px}.pn{font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:34px}
.mut{color:var(--mut);font-size:12px}.old{text-decoration:line-through;color:var(--mut);font-size:12px}.stars{color:var(--gold);font-size:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;background:var(--lil);color:var(--p1);font-size:12px;font-weight:600}.pill.g{background:#d9f5e3;color:#0b6b30}.pill.r{background:#fde4e8;color:#a3132a}.pill.y{background:#fff0c9;color:#7a5200}
.box{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}
.list{background:var(--card);border-radius:18px;box-shadow:var(--sh);margin:10px 0;overflow:hidden}.rw{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--ln);background:var(--card);width:100%;text-align:left;text-decoration:none;color:inherit}.rw:last-child{border-bottom:0}
.ri{width:34px;height:34px;border-radius:11px;background:var(--lil);color:var(--b);display:grid;place-items:center;flex:none}.rw>span:nth-child(2){flex:1}
